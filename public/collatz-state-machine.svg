<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <!-- Background -->
  <rect width="640" height="360" rx="12" fill="#111113"/>

  <!-- Title -->
  <text x="320" y="35" text-anchor="middle" fill="#6F6F76" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" letter-spacing="2">STATE MACHINE</text>

  <!-- Start node -->
  <circle cx="320" cy="80" r="22" stroke="#7C3AED" stroke-width="2" fill="#17171A"/>
  <text x="320" y="85" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500">Start</text>

  <!-- OddNode -->
  <rect x="80" y="170" width="150" height="60" rx="8" stroke="#7C3AED" stroke-width="2" fill="#17171A"/>
  <text x="155" y="205" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500">OddNode</text>

  <!-- EvenNode -->
  <rect x="400" y="170" width="150" height="60" rx="8" stroke="#7C3AED" stroke-width="2" fill="#17171A"/>
  <text x="475" y="205" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500">EvenNode</text>

  <!-- End -->
  <rect x="400" y="290" width="150" height="50" rx="8" stroke="#22C55E" stroke-width="2" fill="#17171A"/>
  <text x="475" y="320" text-anchor="middle" fill="#22C55E" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">End(Result)</text>

  <!-- Arrow: Start → OddNode (odd start) -->
  <path d="M302 98 L175 168" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="210" y="125" text-anchor="middle" fill="#6F6F76" font-family="JetBrains Mono, monospace" font-size="11">odd</text>

  <!-- Arrow: Start → EvenNode (even start) -->
  <path d="M338 98 L455 168" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="425" y="125" text-anchor="middle" fill="#6F6F76" font-family="JetBrains Mono, monospace" font-size="11">even</text>

  <!-- Arrow: OddNode → EvenNode (3n+1) -->
  <path d="M230 185 L400 185" stroke="#B3B3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="315" y="177" text-anchor="middle" fill="#6F6F76" font-family="JetBrains Mono, monospace" font-size="11">3n + 1</text>

  <!-- Arrow: EvenNode → OddNode (n/2, odd) -->
  <path d="M400 215 L230 215" stroke="#B3B3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="315" y="236" text-anchor="middle" fill="#6F6F76" font-family="JetBrains Mono, monospace" font-size="11">n/2</text>

  <!-- Arrow: EvenNode → EvenNode (self-loop right) -->
  <path d="M550 185 C 585 185, 585 215, 550 215" stroke="#B3B3B8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="595" y="203" text-anchor="start" fill="#6F6F76" font-family="JetBrains Mono, monospace" font-size="10">n/2</text>

  <!-- Arrow: EvenNode → End (value == 1) -->
  <path d="M475 230 L475 288" stroke="#22C55E" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="495" y="265" text-anchor="start" fill="#6F6F76" font-family="JetBrains Mono, monospace" font-size="11">n == 1</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B3B3B8"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#22C55E"/>
    </marker>
  </defs>
</svg>
